  <div class="page">
    <h1>Layout keterbacaan</h1>
    <p>
      Wadah <code>.page</code> memakai <code>max-width</code> dan
      <code>margin: 0 auto</code> agar baris tidak melebar seukuran monitor lebar.
    </p>
    <p>
      Coba kecilkan jendela browser: konten tetap terbaca. Bandingkan dengan
      menghapus <code>max-width</code> sementara — mata cepat lelah di layar lebar.
    </p>
