<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bug 1: title masih menyebut P28 bukan nama spek yang benar -->
    <title>Info Kantin Kelas X P28</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Info Kantin Kelas X</h1>
    </header>
    <main>
      <section id="status-menu">
        <h2>Status Menu</h2>
        <p id="pesan">Status belum dicek.</p>
        <button id="tombolUtama" type="button">Cek Status</button>
      </section>
      <section id="daftar-menu">
        <h2>Daftar Menu</h2>
        <ul>
          <li>Mie Sehat</li>
          <li>Es Teh</li>
          <li>Nasi Kotak</li>
        </ul>
      </section>
      <section id="jam-buka">
        <h2>Jam Buka</h2>
        <p>Buka pukul 07.00 – 14.00.</p>
        <p id="sorotanCadangan">Sorotan cadangan belum diperbarui.</p>
        <button id="tombolCadangan" type="button">Perbarui Sorotan</button>
      </section>
    </main>
    <footer>
      <p>Demo P32 — bugfix kecil ada 2 item.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
