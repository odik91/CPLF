<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contoh Media — CPLF</title>
</head>
<body>
  <h1>Media di HTML</h1>

  <!-- start figure -->
  <figure>
    <img
      src="assets/placeholder.svg"
      alt="Kotak abu-abu bertuliskan placeholder sebagai gambar contoh"
      width="320"
      height="180"
    />
    <figcaption>
      Gambar memakai <code>src</code> (lokasi file) dan <code>alt</code> (teks alternatif).
    </figcaption>
  </figure>
  <!-- end figure -->

  <!-- start paragraph -->
  <p>
    Ganti <code>src</code> ke foto kamu sendiri jika punya.
    Jangan kosongkan <code>alt</code> untuk gambar yang membawa informasi.
  </p>
  <!-- end paragraph -->
  
  <p><a href="index.html">← Daftar contoh</a></p>
</body>
</html>
