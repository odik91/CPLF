<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contoh Daftar — CPLF</title>
  </head>
  <body>
    <!-- start kontent dari sini -->
    <!-- pastikan semua tag yang berpasangan memiliki closing tag -->
    <h1>Daftar di HTML</h1>

    <h2>Tak berurut (<code>ul</code>)</h2>
    <!-- start list tak berurut -->
    <ul>
      <li>Boilerplate</li>
      <li>Semantik</li>
      <li>Baru CSS</li>
    </ul>
    <!-- end list tak berurut -->
     
    
    <h2>Berurut (<code>ol</code>)</h2>
    <!-- start list berurut -->
    <ol>
      <li>Tulis spek</li>
      <li>Bangun section</li>
      <li>Uji kriteria penerimaan</li>
    </ol>
    <!-- end list berurut -->

    <h2>Istilah (<code>dl</code>)</h2>
    <!-- start list istilah -->
    <dl>
      <dt>HTML</dt>
      <dd>Bahasa penanda struktur halaman.</dd>
      <dt>Semantik</dt>
      <dd>Nama tag sesuai peran isi.</dd>
    </dl>
    <!-- end list istilah -->
    <p><a href="index.html">← Daftar contoh</a></p>

    <!-- end kontent dari sini -->
  </body>
</html>
