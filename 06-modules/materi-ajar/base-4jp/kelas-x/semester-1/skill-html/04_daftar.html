<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contoh Daftar — CPLF</title>
</head>
<body>
  <h1>Daftar di HTML</h1>

  <h2>Tak berurut (<code>ul</code>)</h2>
  <ul>
    <li>Boilerplate</li>
    <li>Semantik</li>
    <li>Baru CSS</li>
  </ul>

  <h2>Berurut (<code>ol</code>)</h2>
  <ol>
    <li>Tulis spek</li>
    <li>Bangun section</li>
    <li>Uji kriteria penerimaan</li>
  </ol>

  <h2>Istilah (<code>dl</code>)</h2>
  <dl>
    <dt>HTML</dt>
    <dd>Bahasa penanda struktur halaman.</dd>
    <dt>Semantik</dt>
    <dd>Nama tag sesuai peran isi.</dd>
  </dl>

  <p><a href="index.html">← Daftar contoh</a></p>
</body>
</html>
