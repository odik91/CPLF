<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contoh Semantik — Profil Mini CPLF</title>
</head>
<body>
  <!-- pastikan konten h1 dan p berada di dalam tag header -->
  <!-- awal header -->
  <header>
    <h1>Warung Belajar Digital</h1>
    <p>Contoh landmark: header berisi identitas situs.</p>
  </header>
  <!-- akhir header -->

  <!-- pastikan konten section berada di dalam tag main -->
  <!-- awal main -->
  <main>
    <section id="tentang">
      <h2>Tentang</h2>
      <p>
        Bagian ini memakai <code>section</code> karena bertema jelas.
        <code>h1</code> hanya satu di halaman; bagian memakai <code>h2</code>.
      </p>
    </section>

    <section id="layanan">
      <h2>Layanan</h2>
      <p>Pelatihan HTML dasar untuk siswa Madrasah Aliyah.</p>
    </section>
  </main>
  <!-- akhir main -->

  <!-- awal footer -->
  <footer>
    <p>Footer: kredit atau kontak ringkas. · <a href="index.html">← Daftar contoh</a></p>
  </footer>
  <!-- akhir footer -->
</body>
</html>
